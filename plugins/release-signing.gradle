// >>> rifthall-release-signing
// Injected verbatim into android/app/build.gradle by plugins/withReleaseSigning.js.
// Do not edit the copy inside android/ — that tree is regenerated by
// `expo prebuild` and any change there is lost. Edit this file.
//
// Paths resolve from `rootProject`, which is android/, so '../credentials'
// is <repo>/credentials. rootProject is used rather than a path relative to
// this snippet because it is stable wherever the snippet is injected.
def rifthallProps = new Properties()
def rifthallPropsFile = rootProject.file('../credentials/keystore.properties')
if (rifthallPropsFile.exists()) {
    rifthallPropsFile.withInputStream { rifthallProps.load(it) }
}
def rifthallSetting = { String name ->
    def value = rifthallProps.getProperty(name) ?: System.getenv(name)
    return value?.trim() ? value.trim() : null
}
def rifthallStoreName = rifthallSetting('RELEASE_STORE_FILE')
def rifthallStoreFile = rifthallStoreName ? rootProject.file('../credentials/' + rifthallStoreName) : null

// The property this whole plugin exists to buy: a release build must fail
// rather than quietly fall back to the Android debug key. Checked against the
// task graph so debug builds and IDE syncs are unaffected.
gradle.taskGraph.whenReady { graph ->
    def packagingRelease = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(?i)(package|assemble|bundle).*Release.*/
    }
    if (!packagingRelease) {
        return
    }
    def missing = ['RELEASE_STORE_FILE', 'RELEASE_KEY_ALIAS', 'RELEASE_STORE_PASSWORD', 'RELEASE_KEY_PASSWORD']
        .findAll { rifthallSetting(it) == null }
    if (!missing.isEmpty()) {
        throw new GradleException("""
Release signing is not configured. This build was stopped before it could fall
back to the Android debug key, which would produce an APK that installs fine and
can never be updated on a store listing.

  Missing:     ${missing.join(', ')}
  Expected in: ${rifthallPropsFile.absolutePath}
               (or the same names as environment variables, for CI)

  Create the upload keystore once, from the repository root:
      bash scripts/make-upload-key.sh
""")
    }
    if (!rifthallStoreFile.exists()) {
        throw new GradleException("""
Release signing keystore not found. This build was stopped before it could fall
back to the Android debug key.

  Looked for: ${rifthallStoreFile.absolutePath}

  RELEASE_STORE_FILE is a bare file name resolved inside <repo>/credentials/,
  not a path. Recreate the keystore with: bash scripts/make-upload-key.sh
""")
    }
}
// <<< rifthall-release-signing
